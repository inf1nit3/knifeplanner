[project]
name = "knifeplanner"
version = "0.1.0"
description = "Griff-Planer für Messerdesigns: Rohling + Material per Foto -> Griffentwurf, Bohrlöcher, Zuschnitt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "ezdxf>=1.3",
    "numpy>=1.26",
    "reportlab>=4.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
knifeplanner = "knifeplanner.cli:main"

[tool.uv]
package = false
